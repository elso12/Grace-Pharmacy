version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: grace_pharmacy_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: pharmflow

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: grace_pharmacy_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/pharmflow
      - JWT_SECRET=pharmflow_jwt_secret_dev_2026!
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: grace_pharmacy_client
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - server

volumes:
  mongo_data: