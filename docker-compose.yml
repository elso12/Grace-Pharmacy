services:
  # 1. MongoDB Database
  mongo:
    image: mongo:latest
    container_name: grace-pharmacy-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # 2. Node.js Express Backend
  server:
    build: ./server
    container_name: grace-pharmacy-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/grace-pharmacy
      - JWT_SECRET=my_super_secret_key_123
    depends_on:
      - mongo

  # 3. React Vite Frontend
  client:
    build: ./client
    container_name: grace-pharmacy-client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api
    depends_on:
      - server

volumes:
  mongo-data: